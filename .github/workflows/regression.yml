name: Cross-Platform Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.2"

# 唯一验收标准是 scripts/regression-gate.sh（release 渲染标准示例的
# engine/web 视频与原始 swgl 参考做 k3diff），需要 GPU/Chrome/参考视频，
# 只在本地跑；CI 只做编译面检查。
jobs:
  native-build:
    name: Rust native build + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run cargo clippy (core)
        run: cargo clippy -p opencat-core --lib -- -D warnings
      - name: Run cargo clippy (engine)
        run: cargo clippy -p opencat-engine --lib -- -D warnings
      - name: Run cargo clippy (opencat)
        run: cargo clippy -p opencat --lib -- -D warnings

  web-build:
    name: Web app typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build

  crate-web-build:
    name: Crate web types + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/opencat-web/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript build
        run: bun run build:types
      - name: Vite build
        run: bunx vite build
