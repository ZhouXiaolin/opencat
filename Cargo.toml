[workspace]
resolver = "3"
members = [
    "crates/opencat-core",
    "crates/opencat-gpu-native",
    "crates/opencat-engine",
    "crates/opencat-liangyi",
    "crates/opencat-three",
    "crates/opencat-shaders",
    "crates/opencat-web",
    "crates/opencat",
    "crates/faac",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_transformer = "0.153.0"
rayon = "1.12.0"
