[workspace]
resolver = "3"
members = [
    "crates/opencat-core",
    "crates/opencat-engine",
    "crates/opencat-web",
    "crates/opencat-web-oracle",
    "crates/opencat",
    "crates/faac",
]
# vendor/ 的 git submodule（fork 的 naga / resvg，留作后期改造底座）不是
# workspace 成员，防止 cargo 扫到它们自己的成员表。
exclude = [
    "vendor/naga",
    "vendor/resvg",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip：默认快速解析对边界值可错 1 ulp（smallpt cam 分量实锤），
# 引擎的浮点 capture 走 v8 stringify → serde 解析往返，必须正确舍入。
serde_json = { version = "1.0", features = ["float_roundtrip"] }
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_transformer = "0.153.0"
rayon = "1.12.0"
flume = "0.11"
