[package]
name = "opencat-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
# GLB/glTF 解析一律走现成 crate（容器/accessor/后续材质层级），不再手写。
# default-features = false 关掉 import（会拖 image 解码栈）；utils 提供遍历工具。
# calc feature 会让 CompactLength 内部变成裸指针 tagged pointer（Style 非
# Send/Sync）。我们的 CSS 求值层已把 calc() 全部化简成字面值，用不到它。
taffy = { version = "0.14.0", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "flexbox_balance",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
] }
serde.workspace = true
serde_json.workspace = true
ahash = "0.8"
hashbrown = "0.17"
kurbo = "0.13.1"
unicode-segmentation = "1.13"
# Version cosmic-text 0.19 pins internally; needed to implement its `Fallback`
# trait (BrowserEmojiFirstFallback in text/mod.rs).
unicode-script = "0.5"
cosmic-text = "0.19.0"
# 0.23 pinned: cosmic-text 0.19.0 (latest) still requires fontdb 0.23
fontdb = "0.23.0"
# Direct swash access for the script offscreen-surface text rasterizer
# (`text::surface`). Same major version cosmic-text 0.19 uses internally.
swash = "0.2"
# removed: imagesize, nom-exif — host-owned probing (issue #40)
log = "0.4"
# Raw-deflate codec for the optional compressed OCIR transport variant
# (`ir::draw_encoding::compress_ir_envelope`). The browser decodes the matching
# stream with `DecompressionStream('deflate-raw')`, so we emit raw deflate
# (no zlib/gzip wrapper). Already in the tree transitively via `image`.
miniz_oxide = "0.9"
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_codegen.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_transformer.workspace = true
rayon.workspace = true
# SVG 对齐工程（docs/svg-align/PLAN.md）：保留 usvg 做解析，绘制侧自研
# （Tree→DrawOp）。resvg 以 fork（ZhouXiaolin/resvg）的 git submodule 形态
# vendor 进仓（vendor/resvg，锚定 054ccf39 = usvg 0.48.1），只开解析所需
# feature；system-fonts 让 text→glyph path 有字形可用（对齐质量归 P5 专项）。
usvg = { path = "../../vendor/resvg/crates/usvg", default-features = false, features = [
    "svgz",
    "text",
    "system-fonts",
] }
# usvg 路径数据类型（PathSegment/Transform），与 usvg 锁同一 0.12。
tiny-skia-path = "0.12.0"
# 标准 CSS 解析器：css::style_engine 用它吃下 tailwindcss CLI 编译产物与手写
# CSS。lightningcss 保留 var() 引用（退化为 UnparsedProperty + TokenList），
# 求值（var/calc/color-mix）由本 crate 的 css::eval 负责。into_owned 把
# 借用输入文本的 StyleSheet<'i> 转成 'static，CssEngine 才能持有它。
lightningcss = { version = "1.0.0-alpha.72", features = ["into_owned"] }

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.tracing-subscriber]
version = "0.3"
features = ["registry"]
optional = true

[features]
default = []
profile = ["tracing", "tracing-subscriber"]
