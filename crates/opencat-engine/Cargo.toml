[package]
name = "opencat-engine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
opencat-core = { path = "../opencat-core" }
# GL 函数面（WebGL 同名 API 形状）：离屏会话、合成器、GPU 命令流执行器
# 共用一份 glow 上下文，会话建立时构建一次。
glow = "0.13.1"
# vendor/naga fork 分支 feat/glsl-es300-to-desktop330：GLSL ES 300 → 桌面
# GLSL 330 core 的转换底座（front::glsl → IR → back::glsl 官方链），取代
# 只换版本行的词法降级。glsl-in/glsl-out 是最小 feature 面。
naga = { path = "../../vendor/naga", features = ["glsl-in", "glsl-out"] }
# 0.23 pinned: cosmic-text 0.19.0 (latest) still requires fontdb 0.23
fontdb = "0.23.0"
anyhow.workspace = true
flume.workspace = true
rayon.workspace = true
image = { version = "0.25.10", features = ["webp"] }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
num_cpus = "1.17.0"
dirs = "7.0.0"

tempfile = "3"

# Host-owned resource probing (issue #40)
imagesize = "=0.15.0"
nom-exif = "=3.8.0"

# 9.x tracks FFmpeg 9 headers (system libavcodec 63.x); 8.1.0 reads removed
# AVCodec fields (pix_fmts/sample_fmts/ch_layouts) and fails to compile.
ffmpeg-next = "9.0.0"
# V8 is the engine's script backend (was rquickjs). The crate links a
# prebuilt V8 (no source build on this machine) and pulls in the
# `use_custom_libcxx` libc++ ABI match for the prebuilt binary.
v8 = { version = "152.2.0", features = ["use_custom_libcxx"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs"] }
pollster = "1.0.1"
wgpu = "30.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# EGL 上下文/表面管理（`dynamic` 运行时加载 libEGL.so.1，无需 pkg-config
# 构建依赖）。Skia 的 binary-cache 构建是 EGL-only（GL 函数解析走
# eglGetProcAddress），所以 Linux 用 EGL 而不是 GLX。
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
# Vulkan 载入与设备创建（gpu::vk）：「Skia / ANGLE / wgpu 三后端统一跑在
# Vulkan SwiftShader」的底座——同一份 SwiftShader ICD 同时喂给三者。
# ash 0.38 的句柄模型与 API 与旧版不同，改版要核对 src/instance.rs。
ash = "0.38"
# skia-bindings 的裸 C 入口：skia-safe 0.153.3 没有封装 Vulkan 纹理的导入
# （`gpu::backend_textures::make_vulkan` 不存在），但底层
# `C_GrBackendTexture_newVk` 在生成的 bindings.rs 里可用——「三后端统一到
# Vulkan」要用它把 ANGLE 的 VkImage 包成 Skia 的 backend texture。
# 依赖它**不改变** skia-safe 的 feature 组合，所以不影响预编译包的 key。
skia-bindings = "0.153.3"
# `vulkan` 是「Skia / ANGLE / wgpu 三后端统一跑在 Vulkan SwiftShader」
# 的第一步：Skia 的 Vulkan backend 只在这个 feature 下编译进来。
# 这组 feature 恰好命中 rust-skia 官方预编译包
# `x86_64-unknown-linux-gnu-egl-ganesh-gl-jpegd-jpege-pdf-skottie-svg-textlayout-vulkan-wayland-webpd-webpe-x11`
# （见 ~/.zshrc 的 SKIA_BINARIES_URL），改 feature 会让 skia-bindings
# 回退到全量源码编译，所以不要增删这里的 feature。
skia-safe = { version = "0.153.3", features = [
    "binary-cache",
    "embed-icudtl",
    "pdf",
    "jpeg",
    "ganesh",
    "gl",
    "egl",
    "vulkan",
    "x11",
    "wayland",
    "textlayout",
    "svg",
    "skottie",
    "webp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27.0"
foreign-types = "0.5.0"
# MTLDevice/MTLCommandQueue 与读回 blit（gpu/metal.rs）。
metal = "0.33.0"
# 读回 blit 的 completion handler（metal 0.33 自身依赖同一版本）。
block = "0.1.6"
# No `skottie`: rust-skia ships no prebuilt binaries with Skottie for
# x86_64-apple-darwin (only Linux), which would force a full Skia source
# build. Native Lottie is disabled on macOS for now — see
# `executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.153.3", features = ["ganesh", "metal", "binary-cache"] }
core-graphics-types = "0.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
# No `skottie` — rust-skia publishes no prebuilt windows-msvc binaries with
# Skottie (only linux/egl), which would force a full Skia source build.
# Native Lottie is disabled on Windows too — see
# `render::executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl"] }
# ANGLE 静态后端（D3D11）：`gpu/angle.rs` 只在 Windows 编译，而 mozangle 的
# `egl` feature 在非 Windows 平台会 panic（build.rs 硬断言），所以本依赖
# 必须是 Windows-only。
mozangle = { version = "0.7.1", features = ["egl"] }
# WGL 隐藏窗口与 GL 入口解析（gpu/win32.rs）。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
