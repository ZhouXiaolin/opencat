[package]
name = "opencat-engine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
opencat-core = { path = "../opencat-core" }
# 3D 渲染后端（wgpu）：Scene3 快照 → straight-alpha RGBA，经 generated
# image 进合成；web 侧走同一 WGSL 的 wasm 后端。
opencat-three = { path = "../opencat-three" }
fontdb = "0.23.0"
anyhow.workspace = true
image = "0.25.10"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
num_cpus = "1.17.0"
dirs = "7.0.0"

# Video-transport oracle: the harness hands back one base64 H.264 MP4 and
# decodes it with ffmpeg, so base64 + a scratch path for the temp file.
base64 = "0.23"
tempfile = "3"

# Host-owned resource probing (issue #40)
imagesize = "=0.15.0"
nom-exif = "=3.8.0"

# 9.x tracks FFmpeg 9 headers (system libavcodec 63.x); 8.1.0 reads removed
# AVCodec fields (pix_fmts/sample_fmts/ch_layouts) and fails to compile.
ffmpeg-next = "9.0.0"
rquickjs = { version = "0.14.0", features = ["futures"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs"] }

[dev-dependencies]
opencat-core = { path = "../opencat-core", features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl", "skottie"] }

[target.'cfg(target_os = "macos")'.dependencies]
foreign-types = "0.5.0"
metal = "0.33.0"
# No `skottie`: rust-skia ships no prebuilt binaries with Skottie for
# x86_64-apple-darwin (only Linux), which would force a full Skia source
# build. Native Lottie is disabled on macOS for now — see
# `executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.153.3", features = ["metal", "binary-cache"] }
core-graphics-types = "0.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
] }
# No `skottie` — rust-skia publishes no prebuilt windows-msvc binaries with
# Skottie (only linux/egl), which would force a full Skia source build.
# Native Lottie is disabled on Windows too — see
# `executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl"] }
