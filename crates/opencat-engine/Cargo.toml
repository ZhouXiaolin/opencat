[package]
name = "opencat-engine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
opencat-core = { path = "../opencat-core" }
fontdb = "0.23.0"
anyhow.workspace = true
image = "0.25.10"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
num_cpus = "1.17.0"
dirs = "6.0.0"

# Video-transport oracle: the harness hands back one base64 H.264 MP4 and
# decodes it with ffmpeg, so base64 + a scratch path for the temp file.
base64 = "0.22"
tempfile = "3"

# Host-owned resource probing (issue #40)
imagesize = "=0.14.0"
nom-exif = "=3.4.2"

# 9.x tracks FFmpeg 9 headers (system libavcodec 63.x); 8.1.0 reads removed
# AVCodec fields (pix_fmts/sample_fmts/ch_layouts) and fails to compile.
ffmpeg-next = "9.0.0"
rquickjs = { version = "0.11.0", features = ["futures"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "socks"] }
tokio = { version = "1.51.0", features = ["rt-multi-thread", "fs"] }

[dev-dependencies]
opencat-core = { path = "../opencat-core", features = ["test-support"] }
tempfile = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
skia-safe = { version = "0.93.1", features = ["binary-cache", "gl", "skottie"] }

[target.'cfg(target_os = "macos")'.dependencies]
foreign-types = "0.5.0"
metal = "0.31.0"
# No `skottie`: rust-skia ships no prebuilt binaries with Skottie for
# x86_64-apple-darwin (only Linux), which would force a full Skia source
# build. Native Lottie is disabled on macOS for now — see
# `executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.93.1", features = ["metal", "binary-cache"] }
core-graphics-types = "0.1.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
] }
