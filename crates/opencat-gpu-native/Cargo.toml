[package]
name = "opencat-gpu-native"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
# GL 函数面加载（WebGL 同名 API 形状）：engine 的离屏会话与预览共用一份
# glow 上下文，FBO/PBO/纹理原语全部走它，本 crate 不再手写 GL extern。
glow = "0.13.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# MTLDevice/MTLCommandQueue 与读回 blit。与 opencat-engine 同版本，整棵
# 依赖树归一到一份构建。
metal = "0.33.0"
# 读回 blit 的 completion handler（metal 0.33 自身依赖同一版本）。
block = "0.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
# EGL 上下文/表面管理（`dynamic` 运行时加载 libEGL.so.1，无需 pkg-config
# 构建依赖）。Skia 的 binary-cache 构建是 EGL-only（GL 函数解析走
# eglGetProcAddress），所以 Linux 用 EGL 而不是 GLX。
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
