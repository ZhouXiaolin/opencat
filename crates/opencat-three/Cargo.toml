[package]
name = "opencat-three"
version.workspace = true
edition.workspace = true

[dependencies]
opencat-core = { path = "../opencat-core" }
# 原生图形 API 的唯一落点（GL/Metal/EGL 与平台上下文引导）。
opencat-gpu-native = { path = "../opencat-gpu-native" }
wgpu = "30"
glam = "0.34"
# GLSL → naga IR → WGSL：three.js `ShaderMaterial` 的脚本着色器进 wgpu 的
# 编译桥（front::glsl 450 core + back::wgsl）。与 wgpu 30 同版本号——cargo
# 特性归一后与 wgpu 内部的 naga 是同一份构建。只用 uniform buffer 的脚本
# 材质保持 WebGL2 硬约束（见模块文档）。
naga = { version = "30", features = ["glsl-in", "wgsl-out"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow.workspace = true
# Renderer3d::new 是 async（wgpu 设备请求）；宿主注入路径（Scene3Raster）
# 在同步渲染流里懒初始化，需要 block_on。
pollster = "1"

[dev-dependencies]
image = "0.25"
# PoC：GL 纹理共享（wgpu texture id → Skia BackendTexture）。仅在 Windows
# 上编译，验证 Skia 能否直接用 wgpu 的 WGL context + 纹理。
# 正式合成器在 opencat-engine（它已同时依赖 skia-safe 与 opencat-three）。
[target.'cfg(target_os = "windows")'.dev-dependencies]
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl"] }
# `external_gl_share` PoC：自建隐藏窗口 + WGL 上下文（模拟 opencat-see 的
# 窗口上下文），验证 wgpu 能加入宿主的 GL 上下文。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

