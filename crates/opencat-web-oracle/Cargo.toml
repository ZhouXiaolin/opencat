[package]
name = "opencat-web-oracle"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
opencat-core = { path = "../opencat-core" }
opencat-engine = { path = "../opencat-engine" }
anyhow.workspace = true
serde_json.workspace = true
# Webdriver HTTP client. Same feature set as opencat-engine's fetch.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
# The render binary drives reqwest's async client from a block_on runtime.
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "opencat-web-render"
path = "src/bin/opencat-web-render.rs"
