<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenCat Web Frame Oracle</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="frame"></canvas>
    <script src="/canvaskit/canvaskit.js"></script>
    <!-- MP4Box.js muxer (classic script → global `MP4Box`). Served from the
         repo's web/node_modules by the harness static server. The video
         transport encodes each rendered frame with WebCodecs and muxes here,
         so only one MP4 crosses the WebDriver boundary instead of a
         16.6 MB hex string per 1920×1080 frame. -->
    <script src="/mp4box.js"></script>
    <script type="module">
      import {
        clearBlobs,
        clearVideoCache,
        dumpEncodedFrameOps,
        getDecodedVideoFrame,
        getReusableSurface,
        releaseReusableSurface,
        getRendererOrThrow,
        initWasm,
        prepareCatalogVideoSources,
        registerVideoGlobals,
        renderEncodedDrawFrame,
        setAssetReader,
        setWasmBaseUrl,
        setWorkerBaseUrl,
        RenderSession,
        avcCodecString,
        probeBitrate,
      } from '/wasm/opencat.js';

      // The oracle runs inside a real Chrome. The recorded WebGL2/WebGPU
      // streams (OCIR section 13) replay through the browser-native
      // executors bundled in the facade (RenderSession →
      // executeGpuStreamsForFrame). The legacy "native" path — the browser
      // executing the page's own GL/WGPU calls with a frame-end readback —
      // stays reachable only via query params (?nativeGL=1 / ?nativeGPU=1)
      // for stream-vs-native probes.
      const q = new URLSearchParams(location.search);
      globalThis.__ocNativeWebGL = q.get('nativeGL') === '1';
      globalThis.__ocNativeWebGPU = q.get('nativeGPU') === '1';
      // 零拷贝采集：VideoFrame(WebGL canvas) 直采，跳过 snapshot/readPixels/
      // putImageData（采集侧 -125ms/帧）。仅限 HW GL 腿：纹理抓取按 limited
      // 转换，bin 侧必须配 OC_ORACLE_VUI_TV=1 同步标 tv。裸旗标形态
      // （OC_ORACLE_PAGE_EXTRA=vfcopy → &vfcopy）也认。
      globalThis.__ocVfCopy = q.has('vfcopy');
      // oracle 实时探针（[oc-live] 墙钟行）默认关：render-session/gl-executor
      // 的 /oracle-log fetch 只有这里为 true 才发（生产 dist 无该端点）。
      globalThis.__ocOracleLog = q.has('oraclelog');

      const canvas = document.getElementById('frame');
      // Live phase probe: console lines only reach the driver after the whole
      // render resolves; POST each stamp to /oracle-log so in-flight timing
      // (where did the wall-clock go?) is visible while the run is running.
      const tlog = (msg) => {
        // performance.timeOrigin-based epoch: the realm shims global Date to
        // the virtual composition clock (Date.now() → 0 after open_design),
        // performance stays real in page scope.
        const line = `${Math.round(performance.timeOrigin + performance.now())} ${msg}`;
        console.log(`[t0] ${line}`);
        fetch('/oracle-log', { method: 'POST', body: line }).catch(() => {});
      };
      // Scene-cut detection canvas. Created HERE at page load, not inside
      // renderFramesToMp4: after open_design the wasm realm patches the main
      // thread's canvas factories and a freshly-created 2D context loses
      // drawImage/getImageData (the same trap that forces probes to grab
      // __probeCtx before open).
      const sceneCanvas = document.createElement('canvas');
      sceneCanvas.width = 48;
      sceneCanvas.height = 27;
      const sceneCtx = sceneCanvas.getContext('2d', { willReadFrequently: true });

      // 渲染半环（open-once 管线 / 可复用 surface / warmup / settle）的唯一
      // 实现在 facade 的 RenderSession；页面持有当前 envelope 的单例。
      let session = null;
      let sessionFor = null;

      async function ensureSession(envelope) {
        // Probe sticky handle: lets web-step `eval` steps reuse the session
        // (drawFrame etc.) without re-passing the multi-KB envelope through
        // the command line. Set on every ensure, so it always matches session.
        globalThis.__ocLastEnv = envelope;
        const comp = compositionInfo(envelope);
        if (sessionFor !== envelope) {
          session?.destroy();
          tlog("session-create-start");
          session = await RenderSession.create(
            canvas, envelope, comp, comp.frames, { frameOutput: 'source' });
          sessionFor = envelope;
          tlog("session-create-done");
        }
        return session;
      }

      function compositionFrameCount(fps, duration, frames) {
        if (Number.isFinite(frames) && frames > 0) return Math.floor(frames);
        const f = Number(fps) || 30;
        const d = Number(duration) || 0;
        return Math.max(1, Math.ceil(d * f));
      }

      // Composition base dir from the envelope (`baseDir`): composition-
      // relative asset paths (`assets/...`) fetch as `/assets/<baseDir>/<path>`,
      // which the harness static server maps under the example directory.
      let compositionBaseDir = '';

      function parseCompositionInfo(source) {
        // The host hands over the extracted HTML envelope:
        // {extract: {meta, css, tree, html}, driver, baseDir, html: true}.
        const envelope = JSON.parse(source);
        const meta = (envelope.extract && envelope.extract.meta) || {};
        compositionBaseDir = String(envelope.baseDir || '').replace(/\/+$/, '');
        // Standard HTML URL resolution for code that fetches relative paths
        // (three's GLTFLoader, <img src>, fetch('assets/...')): resolve them
        // against the composition, not the oracle page. Absolute `/assets/...`
        // requests from the wasm asset reader are unaffected.
        let base = document.querySelector('base');
        if (!base) {
          base = document.createElement('base');
          document.head.prepend(base);
        }
        base.href = compositionBaseDir ? `/assets/${compositionBaseDir}/` : '/';
        return {
          width: meta.width,
          height: meta.height,
          fps: meta.fps,
          frames: compositionFrameCount(meta.fps, meta.duration, meta.frames),
        };
      }

      function bytesToHex(bytes) {
        // 8.3M bytes/frame (1920×1080×4): build via a 256-entry table + join
        // instead of per-byte `out += …`, which allocates a rope chunk per byte.
        const LOOKUP = new Array(256);
        for (let i = 0; i < 256; i++) LOOKUP[i] = i.toString(16).padStart(2, '0');
        const parts = new Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) parts[i] = LOOKUP[bytes[i]];
        return parts.join('');
      }

      const ready = (async () => {
        tlog("page-script");
        setWasmBaseUrl('/wasm/');
        setWorkerBaseUrl('/wasm/');
        await initWasm();
        tlog("wasm-ready");
        setAssetReader(async (path) => {
          // Composition-relative logical path (`assets/...`). Try the
          // composition base first (authoritative), then the bare path against
          // the repo assets pool, then the legacy basename fallback.
          const p = String(path).replace(/^\.\//, '');
          const urls = [];
          if (compositionBaseDir) urls.push(`/assets/${compositionBaseDir}/${p}`);
          urls.push(`/assets/${p}`, `/assets/${p.split('/').pop()}`);
          for (const url of urls) {
            const response = await fetch(url);
            if (response.ok) return await response.arrayBuffer();
          }
          throw new Error(`asset reader: not found for ${path} (tried ${urls.join(', ')})`);
        });
        const CK = await globalThis.CanvasKitInit({
          locateFile: (file) => `/canvaskit/${file}`,
        });
        globalThis.__canvasKit = CK;
        registerVideoGlobals();
        try {
          const probe = document.createElement('canvas');
          const gl = probe.getContext('webgl2');
          if (gl) {
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            const renderer = dbg
              ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
              : gl.getParameter(gl.RENDERER);
            tlog(`gl-renderer ${renderer}`);
          } else {
            tlog('gl-renderer none');
          }
        } catch (e) {
          tlog(`gl-renderer err ${e}`);
        }
        tlog("ready-done");
      })();

      // Open-once state：管线打开收敛进 RenderSession（见 ensureSession）。
      // Composition metadata is a pure function of the source; parsing it with
      // DOMParser every frame builds a throwaway DOM tree each call (measured
      // as unbounded "JavaScript" growth in measureUserAgentSpecificMemory).
      let cachedComp = null;
      let cachedCompFor = null;

      function compositionInfo(envelope) {
        if (cachedCompFor !== envelope) {
          cachedComp = parseCompositionInfo(envelope);
          cachedCompFor = envelope;
        }
        return cachedComp;
      }

      // Render one frame into the reusable CanvasKit surface. Returns the
      // surface + CK so callers can read back (hex transport) or encode
      // (video transport) without re-deriving state. Pixel readback is left to
      // the caller — it is the expensive, transport-specific step.
      // ?nopreserve → 真 GPU 下不 preserve CK surface（采集走 snapshot 读回）。
      globalThis.__ocSurfaceNoPreserve = location.search.includes('nopreserve');
      async function drawFrame(envelope, frame) {
        const s = await ensureSession(envelope);
        const t0 = performance.now();
        const r = await s.drawFrame(frame);
        if (frame < 160) tlog(`f${frame} inner-draw ${Math.round(performance.now() - t0)}`);
        return r;
      }

      // Native WebGPU warmup（先踢一脚 + 泵 + 重绘，详见 RenderSession）。
      async function warmupNativeAsync(envelope, frame) {
        const s = await ensureSession(envelope);
        await s.warmupNative(frame);
      }

      // Native WebGPU 直读消费（等在途 copyTextureToBuffer 落定后重绘）。
      async function settleNativeWebGpuReadback(envelope, frame) {
        const s = await ensureSession(envelope);
        await s.settleNativeWebGpuReadback(frame);
      }

      // Hex transport (sampled oracle): one frame out as raw RGBA hex.
      async function renderFrame(envelope, frame) {
        const { comp, surface, CK } = await drawFrame(envelope, frame);
        const snapshot = surface.makeImageSnapshot();
        try {
          const pixels = snapshot.readPixels(0, 0, {
            width: comp.width,
            height: comp.height,
            colorType: CK.ColorType.RGBA_8888,
            alphaType: CK.AlphaType.Premul,
            colorSpace: CK.ColorSpace.SRGB,
          });
          if (!pixels) throw new Error('readPixels returned null');
          return {
            width: comp.width,
            height: comp.height,
            rgbaHex: bytesToHex(pixels),
          };
        } finally {
          snapshot.delete();
        }
      }

      // Whole-range transport: render [startFrame, endFrame], encode one
      // H.264 MP4 in-page, and POST the raw bitstream to the local oracle
      // server (`POST /oracle-video`, handled by `inspect/browser.rs`).
      //
      // Why: the per-frame `rgbaHex` path ships a 33 MB hex string per
      // 1920×1080 frame through WebDriver, and even the earlier base64 MP4
      // return trip (bitstream ×1.33 plus the WebDriver JSON copy) cost a
      // large heap spike per sweep. The page-side fetch crosses the local
      // loopback directly; the WebDriver result carries metadata only.
      //
      // Codec loss is negligible on real content (measured: H.264 CRF 12 over
      // k3-promo engine frames → mae 0.006–0.17, p8 ≈ 0) versus the ~1.64
      // baseline and the 1.0–2.0 gate, so alignment stays meaningful.
      // One snapshot of every memory gauge the oracle can see: JS heap,
      // opencat wasm linear memory, CanvasKit wasm linear memory.
      function sampleMem() {
        const ck = globalThis.__canvasKit;
        const ckBytes =
          ck?.wasmExports?.memory?.buffer?.byteLength ??
          ck?.HEAPU8?.buffer?.byteLength ?? 0;
        return {
          jsHeapMB: Math.round((performance.memory?.usedJSHeapSize ?? 0) / 1e6),
          wasmMB: Math.round(
            (globalThis.__opencatWasmMemory?.buffer?.byteLength ?? 0) / 1e6,
          ),
          ckMB: Math.round(ckBytes / 1e6),
        };
      }

      async function renderFramesToMp4(envelope, startFrame, endFrame, renderOnly = false) {
        tlog("mp4-enter");
        await ready;
        tlog("mp4-after-ready");
        const comp = compositionInfo(envelope);
        const fps = comp.fps || 30;
        if (typeof VideoEncoder === 'undefined') {
          throw new Error('WebCodecs VideoEncoder is unavailable in this browser');
        }
        if (typeof MP4Box === 'undefined') {
          throw new Error('MP4Box.js muxer is unavailable (missing /mp4box.js)');
        }

        if (renderOnly) {
          // Diagnostic: draw every frame without encoder/muxer — isolates
          // render-side memory growth from the encode path.
          await warmupNativeAsync(envelope, startFrame);
          const probeRows = [];
          const renderOnlyTimings = [];
          let lastFrame = startFrame;
          try {
            for (let frame = startFrame; frame <= endFrame; frame++) {
              const t0 = performance.now();
              await drawFrame(envelope, frame);
              await settleNativeWebGpuReadback(envelope, frame);
              renderOnlyTimings.push(Math.round(performance.now() - t0));
              lastFrame = frame;
              if ((frame - startFrame) % 25 === 0) {
                probeRows.push({ at: frame, ...sampleMem() });
              }
            }
          } catch (err) {
            throw new Error(
              `render-only aborted at frame ${lastFrame}: ${err}; mem=${JSON.stringify(probeRows)}`,
            );
          }
          const n = renderOnlyTimings.length;
          probeRows.push({
            at: 'render-timing',
            frames: n,
            renderAvgMs: Math.round(renderOnlyTimings.reduce((s, v) => s + v, 0) / n),
            renderMaxMs: Math.max(...renderOnlyTimings),
            detail: renderOnlyTimings,
          });
          return {
            width: comp.width,
            height: comp.height,
            fps,
            firstFrame: startFrame,
            framesEncoded: endFrame - startFrame + 1,
            bytes: 0,
            probe: probeRows,
          };
        }

        // codec 串与码率公式来自 facade encoder-config 单源（交付路与对拍
        // 路共用一份）；colorRange 约定注释也随单源走。
        const codec = avcCodecString(comp.height);
        const config = {
          codec,
          width: comp.width,
          height: comp.height,
          bitrate: probeBitrate(comp.width, comp.height, fps),
          // colorRange 不设：WebCodecs 默认 full——RGB→YUV 按 full 转、mux 标
          // pc，与 full9/swgl 基线、engine ffmpeg 软编同量阶。设 'studio'
          // 会让编码器按 limited 压缩而 mux 仍标 pc → 全帧色移 mae≈13
          // （k3diff avg_p8 0.24→0.87，w2h act3 同型），VAAPI 与软编都遵循。
          framerate: fps,
          latencyMode: 'quality',
        };
        const support = await VideoEncoder.isConfigSupported(config);
        if (!support.supported) {
          throw new Error(`WebCodecs cannot encode ${codec} at ${comp.width}x${comp.height}`);
        }

        const chunks = [];
        let avcC = null;
        let encodeError = null;
        const encoder = new VideoEncoder({
          output: (chunk, meta) => {
            outAt.push(performance.now());
            const data = new Uint8Array(chunk.byteLength);
            chunk.copyTo(data);
            if (meta && meta.decoderConfig && meta.decoderConfig.description) {
              const d = meta.decoderConfig.description;
              avcC = d instanceof ArrayBuffer
                ? d
                : d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength);
            }
            chunks.push({ data, key: chunk.type === 'key', timestamp: chunk.timestamp });
          },
          error: (err) => { encodeError = err; },
        });
        encoder.configure(config);

        tlog("warmup-start");
        await warmupNativeAsync(envelope, startFrame);
        tlog("warmup-done");
        let processed = 0;
        // Scene-cut handling: at 0.10 bits/pixel/frame the soft encoder
        // crushes quality on a whole-frame cut — the cut frame (even when the
        // encoder itself makes it an IDR) reconstructs +8-10 luma high and
        // drifts back over the following frames (hyperframes-launch f116-119).
        // 0.30 removes the crush outright; the detector below is the belt to
        // that suspenders: it forces a keyframe at the cut so recovery does
        // not wait for the next periodic IDR. Threshold + cooldown matter:
        // continuous ramps move 2-8/frame and keyframing them starves the
        // bitrate budget for the FOLLOWING frames; real cuts jump 40+. The
        // canvas/ctx live at page scope (see the note at the top of this
        // file).
        let scenePrev = null;
        let sceneCooldown = 0;
        const detectSceneCut = (frame) => {
          if (!sceneCtx || typeof sceneCtx.drawImage !== 'function') return false;
          if (sceneCooldown > 0) { sceneCooldown -= 1; return false; }
          try {
            sceneCtx.drawImage(canvas, 0, 0, 48, 27);
            const cur = sceneCtx.getImageData(0, 0, 48, 27).data;
            let cut = false;
            let d = 0;
            if (scenePrev) {
              for (let i = 0; i < cur.length; i += 4) {
                d += Math.abs(cur[i] - scenePrev[i]) + Math.abs(cur[i + 1] - scenePrev[i + 1]) + Math.abs(cur[i + 2] - scenePrev[i + 2]);
              }
              d = d / (cur.length / 4) * 3;
              cut = d > 15;
            }
            scenePrev = cur;
            if (cut) {
              sceneCooldown = 12;
              console.log('[scene-cut] keyframe at frame', frame, 'diff', Math.round(d));
            }
            return cut;
          } catch (err) {
            console.log('[scene-cut] detector failed:', String(err).slice(0, 120));
            return false;
          }
        };
        // Memory trajectory: a continuous whole-movie encode lives or dies on
        // per-frame retention; the sampled path localizes any abort. The last
        // 80 samples ride along on the error if the loop dies mid-run.
        const memProbe = [];
        const probe = (label) => {
          memProbe.push({
            at: label,
            ...sampleMem(),
            chunksMB: Math.round(chunks.reduce((s, c) => s + c.data.length, 0) / 1e6),
            queue: encoder.encodeQueueSize,
          });
          if (memProbe.length > 80) memProbe.shift();
        };
        let lastFrame = startFrame;
        const frameTimings = [];
        // 编码输出节拍：output 回调时间戳 → 排空节奏（真实吞吐 vs 入队节奏）。
        const outAt = [];
        const loopT0 = performance.now();
        let bpMs = 0;
        let bpHits = 0;
        // 帧汇聚 offscreen（尺寸跟随源 canvas，跨帧复用）。
        let frameSink = null;
        try {
          for (let frame = startFrame; frame <= endFrame; frame++) {
            if (encodeError) throw encodeError;
            const tRender0 = performance.now();
            if (frame < 160) tlog(`f${frame} draw-start`);
            const df = await drawFrame(envelope, frame);
            await settleNativeWebGpuReadback(envelope, frame);
            if (frame < 160) tlog(`f${frame} draw-done renderMs=${Math.round(performance.now() - tRender0)}`);
            const renderMs = Math.round(performance.now() - tRender0);
            const tVf0 = performance.now();
            // 采集：绕开 DOM canvas 合成器提交路径（drawImage 实测 ~900ms/帧），
            // CK surface readPixels 直读 skia 帧缓冲 → putImageData 进
            // offscreen sink（vf-from-sink 实测 ~4ms）。
            if (!frameSink || frameSink.width !== df.comp.width || frameSink.height !== df.comp.height) {
              const OCReal = globalThis.__ocRealOffscreenCanvas || OffscreenCanvas;
              frameSink = new OCReal(df.comp.width, df.comp.height);
              // willReadFrequently 强制软件 2D canvas：GPU 加速 2D 下
              // VideoFrame(canvas) 纹理抓取按 limited 转换（SW 腿无此转换，
              // RADV 腿全帧色移 mae≈13 的根因）。
              frameSink.getContext('2d', { willReadFrequently: true });
            }
            const tCopy0 = performance.now();
            if (globalThis.__ocVfCopy) {
              // 零拷贝：直采 WebGL canvas（GPU 后端纹理抓取）。同任务内
              // 同步发起——中间插任何宏任务合成都可能让 preserve 关闭的
              // 交换链被清。必须在 HW GL + OC_ORACLE_VUI_TV=1 下跑。
              if (frame < 160) tlog(`f${frame} cap-vfcopy`);
              const vf = new VideoFrame(df.canvas, {
                timestamp: Math.round((frame * 1_000_000) / fps),
                duration: Math.round(1_000_000 / fps),
              });
              if (frame < 160) tlog(`f${frame} cap-vf`);
              encoder.encode(vf, { keyFrame: detectSceneCut(frame) || (frame - startFrame) % fps === 0 });
              vf.close();
              if (frame < 160) tlog(`f${frame} encoded`);
              const vfMs = Math.round(performance.now() - tVf0);
              frameTimings.push({ frame, renderMs, vfMs, queue: encoder.encodeQueueSize });
              processed += 1;
              lastFrame = frame;
              // Backpressure 与主路径逐字一致（MessageChannel yield）。
              const tBp0 = performance.now();
              while (encoder.encodeQueueSize > 8) {
                await new Promise((resolve) => {
                  let settled = false;
                  const once = () => {
                    if (settled) return;
                    settled = true;
                    encoder.ondequeue = null;
                    resolve();
                  };
                  encoder.ondequeue = once;
                  const ch = new MessageChannel();
                  ch.port1.onmessage = () => { ch.port1.close(); once(); };
                  ch.port2.postMessage(0);
                });
              }
              bpMs += performance.now() - tBp0;
              bpHits += 1;
              if (processed % 25 === 0) tlog(`loop f=${frame} renderMs=${renderMs} bpMs=${Math.round(bpMs)} q=${encoder.encodeQueueSize}`);
              if (processed % 50 === 0) probe(frame);
              continue;
            }
            const snap = df.surface.makeImageSnapshot();
            if (frame < 160) tlog(`f${frame} cap-snap`);
            const px = snap.readPixels(0, 0, {
              width: df.comp.width,
              height: df.comp.height,
              colorType: df.CK.ColorType.RGBA_8888,
              alphaType: df.CK.AlphaType.Unpremul,
              colorSpace: df.CK.ColorSpace.SRGB,
            });
            snap.delete();
            if (!px) throw new Error(`readPixels null at f${frame}`);
            if (frame < 160) tlog(`f${frame} cap-read`);
            frameSink.getContext('2d').putImageData(
              new ImageData(new Uint8ClampedArray(px.buffer, px.byteOffset, px.length), df.comp.width, df.comp.height),
              0, 0,
            );
            if (frame < 160) tlog(`f${frame} sink-copy`);
            const vf = new VideoFrame(frameSink, {
              timestamp: Math.round((frame * 1_000_000) / fps),
              duration: Math.round(1_000_000 / fps),
            });
            if (frame < 160) tlog(`f${frame} cap-vf`);
            // Keyframe every ~1 s bounds seek cost; intra-only would inflate size.
            // Scene cuts force an IDR immediately (see detectSceneCut above).
            encoder.encode(vf, { keyFrame: detectSceneCut(frame) || (frame - startFrame) % fps === 0 });
            vf.close();
            if (frame < 160) tlog(`f${frame} encoded`);
            const vfMs = Math.round(performance.now() - tVf0);
            frameTimings.push({ frame, renderMs, vfMs, queue: encoder.encodeQueueSize });
            processed += 1;
            lastFrame = frame;
            // Backpressure: never let the encoder queue (and its retained
            // VideoFrames) grow without bound. Yield via MessageChannel —
            // NOT setTimeout: after open_design the realm shims the global
            // timer face onto the virtual composition clock (and headless
            // pages hit Chrome's intensive timer throttling after 5 min),
            // so a timer-based park here stalls the whole export loop.
            // ondequeue wins the race when the encoder offers a slot.
            const tBp0 = performance.now();
            while (encoder.encodeQueueSize > 8) {
              await new Promise((resolve) => {
                let settled = false;
                const once = () => {
                  if (settled) return;
                  settled = true;
                  encoder.ondequeue = null;
                  resolve();
                };
                encoder.ondequeue = once;
                const ch = new MessageChannel();
                ch.port1.onmessage = () => { ch.port1.close(); once(); };
                ch.port2.postMessage(0);
              });
            }
            bpMs += performance.now() - tBp0;
            bpHits += 1;
            if (processed % 25 === 0) tlog(`loop f=${frame} renderMs=${renderMs} bpMs=${Math.round(bpMs)} q=${encoder.encodeQueueSize}`);
            if (processed % 50 === 0) probe(frame);
          }
        } catch (err) {
          throw new Error(
            `renderFramesToMp4 aborted at frame ${lastFrame}: ${err}; mem=${JSON.stringify(memProbe)}`,
          );
        }
        probe('mux-enter');
        try {
          const n = frameTimings.length;
          const sum = (k) => frameTimings.reduce((s, r) => s + r[k], 0);
          const max = (k) => frameTimings.reduce((m, r) => Math.max(m, r[k]), 0);
          console.log(`[timing] frames=${n} render avg=${Math.round(sum('renderMs') / n)} max=${max('renderMs')} vf+encode avg=${Math.round(sum('vfMs') / n)} max=${max('vfMs')} queue final=${encoder.encodeQueueSize}`);
          console.log(`[timing] wall loop=${((performance.now() - loopT0) / 1000).toFixed(1)}s bpMs=${Math.round(bpMs)} bpHits=${bpHits} outputs=${outAt.length}`);
          console.log(`[timing] detail=${JSON.stringify(frameTimings)}`);
        } catch (e) { console.log(`[timing] summarize failed ${e}`); }

        const flushT0 = performance.now();
        const queueAtFlush = encoder.encodeQueueSize;
        await encoder.flush();
        console.log(`[timing] flush queue=${queueAtFlush} took=${Math.round(performance.now() - flushT0)}ms`);
        encoder.close();
        // 输出节拍摘要：首尾输出时间 + 中位间隔 + 最长间隔（真实排空节奏）。
        {
          const gaps = outAt.slice(1).map((t, i) => t - outAt[i]).sort((a, b) => a - b);
          if (gaps.length) {
            console.log(`[timing] outputs first@${Math.round(outAt[0] - loopT0)}ms last@${Math.round(outAt[outAt.length - 1] - loopT0)}ms medianGap=${Math.round(gaps[gaps.length >> 1])}ms maxGap=${Math.round(gaps[gaps.length - 1])}ms`);
          }
        }
        if (encodeError) throw encodeError;
        if (chunks.length === 0) throw new Error('WebCodecs produced no chunks');
        if (!avcC) throw new Error('WebCodecs produced no avcC decoder description');

        // Mux. Track timescale == fps so each sample is exactly 1 tick long and
        // dts is the (decode-order) frame index; cts comes from the chunk PTS.
        const muxT0 = performance.now();
        const file = MP4Box.createFile();
        const trackId = file.addTrack({
          timescale: fps,
          width: comp.width,
          height: comp.height,
          avcDecoderConfigRecord: avcC,
        });
        let dts = 0;
        for (const chunk of chunks) {
          file.addSample(trackId, chunk.data, {
            duration: 1,
            dts,
            cts: Math.round((chunk.timestamp * fps) / 1_000_000),
            is_sync: chunk.key,
          });
          dts += 1;
        }
        tlog(`mux ${chunks.length} samples took=${Math.round(performance.now() - muxT0)}ms`);
        // Free the compressed samples before the buffer/base64 copies spike;
        // MP4Box addSample already copied the bytes into the track.
        chunks.length = 0;
        probe('mux-post');
        const mp4 = new Uint8Array(file.getBuffer());

        probe('post-pre');
        const postT0 = performance.now();
        const postRes = await fetch('/oracle-video', { method: 'POST', body: mp4 });
        if (!postRes.ok) {
          throw new Error(`oracle-video POST failed: HTTP ${postRes.status} (${mp4.length} bytes)`);
        }
        tlog(`post ${mp4.length}B took=${Math.round(performance.now() - postT0)}ms`);

        return {
          width: comp.width,
          height: comp.height,
          fps,
          firstFrame: startFrame,
          framesEncoded: processed,
          bytes: mp4.length,
          frameTimings,
        };
      }

      // Module-scope helpers exposed for the harness's eval_js debug channel
      // (webdriver eval runs in a separate script context and cannot see
      // module imports).
      // web-step 分步钩子：把 create 与 draw 拆开，挂死可二分。
      // session() 复刻 RenderSession.open() 的子步序列并逐步打旗标——
      // kickSession 立即返回（harness eval 恒 awaitPromise，不能等它），
      // 挂死时用 flags() 轮询看到最后完成的子步。
      globalThis.__ocDbg = {
        marks: null,
        async session(envelope) {
          const F = this.marks = {};
          const t0 = performance.now();
          const mark = (k) => { F[k] = Math.round(performance.now() - t0); };
          clearBlobs();
          mark('blobs');
          await clearVideoCache();
          mark('vcache');
          const renderer = getRendererOrThrow();
          const catalogJson = await renderer.open_design(envelope);
          mark('open');
          await prepareCatalogVideoSources(catalogJson);
          mark('prep');
          for (let i = 0; i < 30; i++) await new Promise((r) => setTimeout(r, 0));
          mark('pump');
          return 'open-replica done';
        },
        kickSession(envelope) {
          this.session(envelope).catch((e) => { this.marks.error = String(e && e.stack || e); });
          return 'kicked';
        },
        flags() { return JSON.stringify(this.marks); },
        async drawOnly(frame) {
          if (!session) throw new Error('no session; run __ocDbg.session first');
          await session.drawFrame(frame);
          return 'drawOnly ' + frame + ' done';
        },
      };
      globalThis.__opencatOracle = {
        renderFrame, renderFramesToMp4, drawFrame,
        getRendererOrThrow, getReusableSurface, releaseReusableSurface,
        renderEncodedDrawFrame,
        // Step-wise helpers for the web-eval debug driver: open once, then
        // build + render separately so a thrown TypeError carries the exact
        // failing call in its stack.
        async openDesign(envelope) {
          await ready;
          // Set compositionBaseDir before anything fetches assets —
          // open_design's font/asset preloads go through the asset reader.
          compositionInfo(envelope);
          clearBlobs();
          await clearVideoCache();
          const renderer = getRendererOrThrow();
          const catalogJson = await renderer.open_design(envelope);
          await prepareCatalogVideoSources(catalogJson);
          return 'opened';
        },
        buildFrameIr(frame) {
          const renderer = getRendererOrThrow();
          return renderer.build_frame_ir(frame);
        },
        dumpFrameOps(frame, limit) {
          const renderer = getRendererOrThrow();
          const result = renderer.build_frame_ir(frame);
          return dumpEncodedFrameOps(result.ir, limit);
        },
        // Half-scale PNG (base64, no data-url prefix) of the harness canvas
        // as it currently stands. With `frame` given, draw that frame first;
        // without, capture the standing content (sweep-state debugging).
        async captureCanvasPng(envelope, frame) {
          if (frame !== undefined) await drawFrame(envelope, frame);
          const c2 = globalThis.__pngCanvas;
          c2.width = Math.round(1920 / 2);
          c2.height = Math.round(1080 / 2);
          const ctx = c2.getContext('2d');
          ctx.drawImage(canvas, 0, 0, c2.width, c2.height);
          const dataUrl = c2.toDataURL('image/png');
          return dataUrl.substring(dataUrl.indexOf(',') + 1);
        },
        // Decode each mediaPlan video entry at `frame` standalone and report
        // the VideoFrame timestamps the worker actually returned — the
        // authoritative stale-frame detector after a sequential sweep.
        // Also samples a few pixels of the first entry's decoded frame so a
        // wrong-content frame is visible in numbers, not eyeballs.
        async probeVideoTimes(envelope, frame) {
          await ready;
          const renderer = getRendererOrThrow();
          const result = renderer.build_frame_ir(frame);
          const plan = JSON.parse(result.mediaPlan);
          const out = [];
          for (const item of plan.videoFrames ?? []) {
            const f = await getDecodedVideoFrame(item.assetId, item.timeMicros / 1e6, 'exact');
            const entry = {
              assetId: item.assetId,
              wantMicros: item.timeMicros,
              gotMicros: f ? f.timestamp : null,
              w: f ? f.displayWidth : 0,
              h: f ? f.displayHeight : 0,
            };
            if (f) {
              // The wasm realm patches main-thread canvas factories after
              // open_design (no drawImage on their stubs) — use the probe 2D
              // context captured before open_design by the driver.
              const ctx = globalThis.__probeCtx;
              ctx.drawImage(f, 0, 0, 1920, 1080);
              const px = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data.slice(0, 3));
              entry.samples = {
                top: px(960, 30),
                mid: px(960, 540),
                band: px(960, 1040),
              };
            }
            out.push(entry);
            try { f?.close(); } catch { /* ignore */ }
          }
          return JSON.stringify(out);
        },
      };
    </script>
  </body>
