[package]
name = "opencat"
version.workspace = true
edition.workspace = true

[features]
# JS 运行时切换面转发（opencat-engine 同名 feature；default V8）。
# 切 quickjs = --no-default-features --features js-quickjs（feature 互斥
# 无法在 cargo 语法内表达，双开会被 engine 的 compile_error 拒编译）。
default = ["js-v8"]
js-v8 = ["opencat-engine/js-v8"]
js-quickjs = ["opencat-engine/js-quickjs"]
profile = ["opencat-core/profile"]

[dependencies]
opencat-core = { path = "../opencat-core" }
opencat-engine = { path = "../opencat-engine", default-features = false }

anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"
libm = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "opencat"
path = "src/bin/opencat/main.rs"

[[bin]]
name = "opencat-frames"
path = "src/bin/opencat-frames.rs"

# @omp 对拍台：读 V8 采样探针的 `[omp:<fn>]` stderr 行，libm 同输入
# 复算，逐位对比。inspector halftone rayon 派发的 go/no-go 门。
[[bin]]
name = "opencat-omp-verify"
path = "src/bin/opencat-omp-verify.rs"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rodio = "0.22.2"

# 预览器不认识 Skia，也不认识原生图形 API（GL/Metal/EGL）——窗口的图形
# 上下文、Skia 后端、每帧 surface 全在 `opencat_engine::present` 里。
