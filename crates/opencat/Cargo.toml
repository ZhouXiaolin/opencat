[package]
name = "opencat"
version.workspace = true
edition.workspace = true

[features]
profile = ["opencat-core/profile"]

[dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
serde_json.workspace = true
opencat-core = { path = "../opencat-core" }
opencat-engine = { path = "../opencat-engine" }

anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
image = "0.25.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "opencat"
path = "src/bin/opencat.rs"

[[bin]]
name = "opencat-see"
path = "src/bin/opencat-see.rs"

[[bin]]
name = "opencat-frames"
path = "src/bin/opencat-frames.rs"

[[bin]]
name = "opencat-diff"
path = "src/bin/opencat-diff.rs"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rodio = "0.22.2"

# 预览器不认识 Skia，也不认识原生图形 API（GL/Metal/EGL）——窗口的图形
# 上下文、Skia 后端、每帧 surface 全在 `opencat_engine::present` 里。

[[bin]]
name = "opencat-web-compare"
path = "src/bin/opencat-web-compare.rs"
