[package]
name = "opencat"
version.workspace = true
edition.workspace = true

[features]
profile = ["opencat-core/profile"]

[dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
serde_json.workspace = true
opencat-core = { path = "../opencat-core" }
opencat-engine = { path = "../opencat-engine" }

anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "opencat"
path = "src/bin/opencat.rs"

[[bin]]
name = "opencat-see"
path = "src/bin/opencat-see.rs"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rodio = "0.22.2"

[target.'cfg(target_os = "linux")'.dependencies]
# EGL context/surface management for the desktop preview player.
# `dynamic` loads libEGL.so.1 at runtime — no pkg-config build dep.
# Skia's binary-cache build is EGL-only (its internal GL proc resolver
# calls eglGetProcAddress), so EGL — not GLX — is the required backend here.
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl", "skottie"] }

[target.'cfg(target_os = "macos")'.dependencies]
foreign-types = "0.5.0"
metal = "0.33.0"
# No `skottie` — see the matching note in opencat-engine/Cargo.toml.
skia-safe = { version = "0.153.3", features = ["metal", "binary-cache"] }
core-graphics-types = "0.2.0"
cocoa = "0.27.0"
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
] }

# No `skottie` — rust-skia publishes no prebuilt windows-msvc binaries with
# Skottie (only linux/egl), which would force a full Skia source build.
# Native Lottie is disabled on Windows too — see
# `executor::EngineDrawExecutor::ensure_lottie_animations`.
skia-safe = { version = "0.153.3", features = ["binary-cache", "gl"] }

[[bin]]
name = "opencat-web-compare"
path = "src/bin/opencat-web-compare.rs"
