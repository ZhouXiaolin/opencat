[package]
name = "shader-diff-ours"
version = "0.1.0"
edition = "2021"

# ours 槽位：opencat-shaders（Rust wgpu）按 oracle 同契约渲染 shader-diff catalog。
# 独立 crate（不进 workspace）：对拍工具，依赖只限 wgpu/pollster/naga/image/serde。

[[bin]]
name = "ours"
path = "src/main.rs"

[dependencies]
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace]
