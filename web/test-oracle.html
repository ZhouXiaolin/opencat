<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OpenCat Web Frame Oracle</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="frame"></canvas>
    <script src="/canvaskit/canvaskit.js"></script>
    <!-- MP4Box.js muxer (classic script → global `MP4Box`). Served from the
         repo's web/node_modules by the harness static server. The video
         transport encodes each rendered frame with WebCodecs and muxes here,
         so only one MP4 crosses the WebDriver boundary instead of a
         16.6 MB hex string per 1920×1080 frame. -->
    <script src="/mp4box.js"></script>
    <script type="module">
      import {
        clearBlobs,
        clearVideoCache,
        getReusableSurface,
        releaseReusableSurface,
        getRendererOrThrow,
        initWasm,
        injectVideoFramesForRender,
        prepareCatalogVideoSources,
        registerVideoGlobals,
        renderEncodedDrawFrame,
        setAssetReader,
        setWasmBaseUrl,
        setWorkerBaseUrl,
      } from '/wasm/opencat.js';

      const canvas = document.getElementById('frame');
      // Reused across frames: one CanvasKit surface per canvas, not per frame.
      // A fresh canvas surface per frame leaks a WebGL framebuffer (~8 MB at
      // 1920×1080) of GPU-process memory every frame and crashes the tab.
      let surfaceSize = { w: 0, h: 0 };

      function compositionFrameCount(fps, duration, frames) {
        if (Number.isFinite(frames) && frames > 0) return Math.floor(frames);
        const f = Number(fps) || 30;
        const d = Number(duration) || 0;
        return Math.max(1, Math.ceil(d * f));
      }

      // Composition base dir from the envelope (`baseDir`): composition-
      // relative asset paths (`assets/...`) fetch as `/assets/<baseDir>/<path>`,
      // which the harness static server maps under the example directory.
      let compositionBaseDir = '';

      function parseCompositionInfo(source) {
        // The host hands over the extracted JSX envelope:
        // {extract: {meta, fonts, lines}, driver, baseDir}.
        const envelope = JSON.parse(source);
        const meta = (envelope.extract && envelope.extract.meta) || {};
        compositionBaseDir = String(envelope.baseDir || '').replace(/\/+$/, '');
        return {
          width: meta.width,
          height: meta.height,
          fps: meta.fps,
          frames: compositionFrameCount(meta.fps, meta.duration, meta.frames),
        };
      }

      function bytesToHex(bytes) {
        // 8.3M bytes/frame (1920×1080×4): build via a 256-entry table + join
        // instead of per-byte `out += …`, which allocates a rope chunk per byte.
        const LOOKUP = new Array(256);
        for (let i = 0; i < 256; i++) LOOKUP[i] = i.toString(16).padStart(2, '0');
        const parts = new Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) parts[i] = LOOKUP[bytes[i]];
        return parts.join('');
      }

      const ready = (async () => {
        setWasmBaseUrl('/wasm/');
        setWorkerBaseUrl('/wasm/');
        await initWasm();
        setAssetReader(async (path) => {
          // Composition-relative logical path (`assets/...`). Try the
          // composition base first (authoritative), then the bare path against
          // the repo assets pool, then the legacy basename fallback.
          const p = String(path).replace(/^\.\//, '');
          const urls = [];
          if (compositionBaseDir) urls.push(`/assets/${compositionBaseDir}/${p}`);
          urls.push(`/assets/${p}`, `/assets/${p.split('/').pop()}`);
          for (const url of urls) {
            const response = await fetch(url);
            if (response.ok) return await response.arrayBuffer();
          }
          throw new Error(`asset reader: not found for ${path} (tried ${urls.join(', ')})`);
        });
        const CK = await globalThis.CanvasKitInit({
          locateFile: (file) => `/canvaskit/${file}`,
        });
        globalThis.__canvasKit = CK;
        registerVideoGlobals();
      })();

      // Open-once state: the host-owned pipeline (issue #8) is opened a single
      // time and every subsequent frame streams through it. Reopening the
      // design per frame rebuilds the whole pipeline + script realm in WASM
      // linear memory, which grows the renderer process without bound
      // (~10 MB/frame) until the tab is OOM-killed around frame ~90.
      let openedFor = null;
      // Composition metadata is a pure function of the source; parsing it with
      // DOMParser every frame builds a throwaway DOM tree each call (measured
      // as unbounded "JavaScript" growth in measureUserAgentSpecificMemory).
      let cachedComp = null;
      let cachedCompFor = null;

      function compositionInfo(envelope) {
        if (cachedCompFor !== envelope) {
          cachedComp = parseCompositionInfo(envelope);
          cachedCompFor = envelope;
        }
        return cachedComp;
      }

      // Render one frame into the reusable CanvasKit surface. Returns the
      // surface + CK so callers can read back (hex transport) or encode
      // (video transport) without re-deriving state. Pixel readback is left to
      // the caller — it is the expensive, transport-specific step.
      async function drawFrame(envelope, frame) {
        await ready;

        const comp = compositionInfo(envelope);
        if (frame < 0 || frame >= comp.frames) {
          throw new Error(`frame ${frame} out of range 0..${comp.frames - 1}`);
        }

        canvas.width = comp.width;
        canvas.height = comp.height;
        // A previous frame at a different size invalidates the cached surface.
        if (surfaceSize.w !== comp.width || surfaceSize.h !== comp.height) {
          releaseReusableSurface(canvas);
          surfaceSize = { w: comp.width, h: comp.height };
        }

        const renderer = getRendererOrThrow();

        // Open (or reopen, when the composition source changes) the
        // host-owned pipeline: fetches resources, builds the catalog, opens
        // the pipeline. Without prepareCatalogVideoSources,
        // injectVideoFramesForRender silently blanks every VideoFrame draw
        // (profile-showcase s2/s3).
        if (openedFor !== envelope) {
          clearBlobs();
          await clearVideoCache();
          const catalogJson = await renderer.open_design(envelope);
          await prepareCatalogVideoSources(catalogJson);
          openedFor = envelope;
        }

        // Headless SwiftShader often cannot import VideoFrame textures via
        // makeImageFromTextureSource. Inject as CPU RGBA so draw-ir can
        // MakeImage() without a GPU texture path.
        const result = renderer.build_frame_ir(frame);
        await injectVideoFramesForRender({
          mediaPlan: result.mediaPlan,
          quality: 'exact',
          frameOutput: 'source',
        });

        const CK = globalThis.__canvasKit;
        // preserveDrawingBuffer keeps the WebGL back buffer readable after
        // `flush()`: the video transport captures the canvas with
        // `new VideoFrame(canvas)`, which sees a cleared buffer otherwise.
        const surface = getReusableSurface(CK, canvas, undefined, {
          alphaType: CK.AlphaType.Premul,
          preserveDrawingBuffer: 1,
        });
        if (!surface) throw new Error('surface creation failed');

        renderEncodedDrawFrame(result.ir, surface.getCanvas(), CK, { surface });
        surface.flush();
        return { comp, surface, CK };
      }

      // Hex transport (sampled oracle): one frame out as raw RGBA hex.
      async function renderFrame(envelope, frame) {
        const { comp, surface, CK } = await drawFrame(envelope, frame);
        const snapshot = surface.makeImageSnapshot();
        try {
          const pixels = snapshot.readPixels(0, 0, {
            width: comp.width,
            height: comp.height,
            colorType: CK.ColorType.RGBA_8888,
            alphaType: CK.AlphaType.Premul,
            colorSpace: CK.ColorSpace.SRGB,
          });
          if (!pixels) throw new Error('readPixels returned null');
          return {
            width: comp.width,
            height: comp.height,
            rgbaHex: bytesToHex(pixels),
          };
        } finally {
          snapshot.delete();
        }
      }

      // Whole-range transport: render [startFrame, endFrame], encode one
      // H.264 MP4 in-page, and POST the raw bitstream to the local oracle
      // server (`POST /oracle-video`, handled by `inspect/browser.rs`).
      //
      // Why: the per-frame `rgbaHex` path ships a 33 MB hex string per
      // 1920×1080 frame through WebDriver, and even the earlier base64 MP4
      // return trip (bitstream ×1.33 plus the WebDriver JSON copy) cost a
      // large heap spike per sweep. The page-side fetch crosses the local
      // loopback directly; the WebDriver result carries metadata only.
      //
      // Codec loss is negligible on real content (measured: H.264 CRF 12 over
      // k3-promo engine frames → mae 0.006–0.17, p8 ≈ 0) versus the ~1.64
      // baseline and the 1.0–2.0 gate, so alignment stays meaningful.
      // One snapshot of every memory gauge the oracle can see: JS heap,
      // opencat wasm linear memory, CanvasKit wasm linear memory.
      function sampleMem() {
        const ck = globalThis.__canvasKit;
        const ckBytes =
          ck?.wasmExports?.memory?.buffer?.byteLength ??
          ck?.HEAPU8?.buffer?.byteLength ?? 0;
        return {
          jsHeapMB: Math.round((performance.memory?.usedJSHeapSize ?? 0) / 1e6),
          wasmMB: Math.round(
            (globalThis.__opencatWasmMemory?.buffer?.byteLength ?? 0) / 1e6,
          ),
          ckMB: Math.round(ckBytes / 1e6),
        };
      }

      async function renderFramesToMp4(envelope, startFrame, endFrame, renderOnly = false) {
        await ready;
        const comp = compositionInfo(envelope);
        const fps = comp.fps || 30;
        if (typeof VideoEncoder === 'undefined') {
          throw new Error('WebCodecs VideoEncoder is unavailable in this browser');
        }
        if (typeof MP4Box === 'undefined') {
          throw new Error('MP4Box.js muxer is unavailable (missing /mp4box.js)');
        }

        if (renderOnly) {
          // Diagnostic: draw every frame without encoder/muxer — isolates
          // render-side memory growth from the encode path.
          const probeRows = [];
          const renderOnlyTimings = [];
          let lastFrame = startFrame;
          try {
            for (let frame = startFrame; frame <= endFrame; frame++) {
              const t0 = performance.now();
              await drawFrame(envelope, frame);
              renderOnlyTimings.push(Math.round(performance.now() - t0));
              lastFrame = frame;
              if ((frame - startFrame) % 25 === 0) {
                probeRows.push({ at: frame, ...sampleMem() });
              }
            }
          } catch (err) {
            throw new Error(
              `render-only aborted at frame ${lastFrame}: ${err}; mem=${JSON.stringify(probeRows)}`,
            );
          }
          const n = renderOnlyTimings.length;
          probeRows.push({
            at: 'render-timing',
            frames: n,
            renderAvgMs: Math.round(renderOnlyTimings.reduce((s, v) => s + v, 0) / n),
            renderMaxMs: Math.max(...renderOnlyTimings),
            detail: renderOnlyTimings,
          });
          return {
            width: comp.width,
            height: comp.height,
            fps,
            firstFrame: startFrame,
            framesEncoded: endFrame - startFrame + 1,
            bytes: 0,
            probe: probeRows,
          };
        }

        const codec = comp.height <= 1088 ? 'avc1.640028' : 'avc1.640033';
        // 0.10 bits/pixel/frame (≈6 Mbps at 1080p30, clamped to 8 Mbps):
        // the earlier 0.4 factor produced ~25 Mbps and dominated the soft
        // encoder's CPU cost. Gate is mae ≤ 1.0; measured codec loss at this
        // rate stays ~0.1-0.2 mae on dynamic content.
        const config = {
          codec,
          width: comp.width,
          height: comp.height,
          bitrate: Math.max(8_000_000, Math.round(comp.width * comp.height * fps * 0.10)),
          framerate: fps,
          latencyMode: 'quality',
        };
        const support = await VideoEncoder.isConfigSupported(config);
        if (!support.supported) {
          throw new Error(`WebCodecs cannot encode ${codec} at ${comp.width}x${comp.height}`);
        }

        const chunks = [];
        let avcC = null;
        let encodeError = null;
        const encoder = new VideoEncoder({
          output: (chunk, meta) => {
            const data = new Uint8Array(chunk.byteLength);
            chunk.copyTo(data);
            if (meta && meta.decoderConfig && meta.decoderConfig.description) {
              const d = meta.decoderConfig.description;
              avcC = d instanceof ArrayBuffer
                ? d
                : d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength);
            }
            chunks.push({ data, key: chunk.type === 'key', timestamp: chunk.timestamp });
          },
          error: (err) => { encodeError = err; },
        });
        encoder.configure(config);

        let processed = 0;
        // Memory trajectory: a continuous whole-movie encode lives or dies on
        // per-frame retention; the sampled path localizes any abort. The last
        // 80 samples ride along on the error if the loop dies mid-run.
        const memProbe = [];
        const probe = (label) => {
          memProbe.push({
            at: label,
            ...sampleMem(),
            chunksMB: Math.round(chunks.reduce((s, c) => s + c.data.length, 0) / 1e6),
            queue: encoder.encodeQueueSize,
          });
          if (memProbe.length > 80) memProbe.shift();
        };
        let lastFrame = startFrame;
        const frameTimings = [];
        try {
          for (let frame = startFrame; frame <= endFrame; frame++) {
            if (encodeError) throw encodeError;
            const tRender0 = performance.now();
            await drawFrame(envelope, frame);
            const renderMs = Math.round(performance.now() - tRender0);
            const tVf0 = performance.now();
            const vf = new VideoFrame(canvas, {
              timestamp: Math.round((frame * 1_000_000) / fps),
              duration: Math.round(1_000_000 / fps),
            });
            // Keyframe every ~1 s bounds seek cost; intra-only would inflate size.
            encoder.encode(vf, { keyFrame: (frame - startFrame) % fps === 0 });
            vf.close();
            const vfMs = Math.round(performance.now() - tVf0);
            frameTimings.push({ frame, renderMs, vfMs, queue: encoder.encodeQueueSize });
            processed += 1;
            lastFrame = frame;
            // Backpressure: never let the encoder queue (and its retained
            // VideoFrames) grow without bound.
            while (encoder.encodeQueueSize > 8) {
              await new Promise((r) => setTimeout(r, 0));
            }
            if (processed % 50 === 0) probe(frame);
          }
        } catch (err) {
          throw new Error(
            `renderFramesToMp4 aborted at frame ${lastFrame}: ${err}; mem=${JSON.stringify(memProbe)}`,
          );
        }
        probe('mux-enter');
        try {
          const n = frameTimings.length;
          const sum = (k) => frameTimings.reduce((s, r) => s + r[k], 0);
          const max = (k) => frameTimings.reduce((m, r) => Math.max(m, r[k]), 0);
          console.log(`[timing] frames=${n} render avg=${Math.round(sum('renderMs') / n)} max=${max('renderMs')} vf+encode avg=${Math.round(sum('vfMs') / n)} max=${max('vfMs')} queue final=${encoder.encodeQueueSize}`);
          console.log(`[timing] detail=${JSON.stringify(frameTimings)}`);
        } catch (e) { console.log(`[timing] summarize failed ${e}`); }

        const flushT0 = performance.now();
        const queueAtFlush = encoder.encodeQueueSize;
        await encoder.flush();
        console.log(`[timing] flush queue=${queueAtFlush} took=${Math.round(performance.now() - flushT0)}ms`);
        encoder.close();
        if (encodeError) throw encodeError;
        if (chunks.length === 0) throw new Error('WebCodecs produced no chunks');
        if (!avcC) throw new Error('WebCodecs produced no avcC decoder description');

        // Mux. Track timescale == fps so each sample is exactly 1 tick long and
        // dts is the (decode-order) frame index; cts comes from the chunk PTS.
        const file = MP4Box.createFile();
        const trackId = file.addTrack({
          timescale: fps,
          width: comp.width,
          height: comp.height,
          avcDecoderConfigRecord: avcC,
        });
        let dts = 0;
        for (const chunk of chunks) {
          file.addSample(trackId, chunk.data, {
            duration: 1,
            dts,
            cts: Math.round((chunk.timestamp * fps) / 1_000_000),
            is_sync: chunk.key,
          });
          dts += 1;
        }
        // Free the compressed samples before the buffer/base64 copies spike;
        // MP4Box addSample already copied the bytes into the track.
        chunks.length = 0;
        probe('mux-post');
        const mp4 = new Uint8Array(file.getBuffer());

        probe('post-pre');
        const postRes = await fetch('/oracle-video', { method: 'POST', body: mp4 });
        if (!postRes.ok) {
          throw new Error(`oracle-video POST failed: HTTP ${postRes.status} (${mp4.length} bytes)`);
        }

        return {
          width: comp.width,
          height: comp.height,
          fps,
          firstFrame: startFrame,
          framesEncoded: processed,
          bytes: mp4.length,
          frameTimings,
        };
      }

      globalThis.__opencatOracle = { renderFrame, renderFramesToMp4 };
    </script>
  </body>
</html>
